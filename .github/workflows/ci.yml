name: ci

# Offline: no job holds a key or reaches a provider (AGENTS.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  GRIDA_FX_NETWORK: "off"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run check:viewer
      - run: bun --no-env-file run test:viewer
      - run: bun --no-env-file run build:viewer
      # The engine's tests start the TypeScript node host from js/fx/dist on Node 24 when both
      # are there, and skip those tests otherwise.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun --no-env-file install --frozen-lockfile
        working-directory: js/fx
      - run: bun --no-env-file run build
        working-directory: js/fx
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  # docs/guide and docs/wg are published on grida.co/docs (a docs source, see
  # gridaco/docs); this runs that site's rules on them: links, assets, markdown.
  docs:
    uses: gridaco/docs/.github/workflows/source-check.yml@main

  # Static site checks build source only; they never prepare or upload run artifacts.
  www:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run check:www
      - run: bun --no-env-file run test:www
      - run: bun --no-env-file run build:www

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv publishes no major tags; this pins one immutable release.
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check --config pyproject.toml . ../tools ../conformance ../examples ../fixtures
      - run: uv run ruff format --check --config pyproject.toml . ../tools ../conformance/run.py ../examples ../fixtures
      - run: uv run pytest

  # The SDK and its TypeScript node host, on Linux and macOS: the host's tests start it on Node
  # 24 (grida's runtime) and hold it to keeping user output off the protocol on both, and the
  # SDK's engine-driven tests run against a fresh grida-fx.
  js:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    # A host test that hangs fails the job in minutes, not at the six-hour limit.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: js/fx
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # The engine, so the SDK's tests that drive it (stand-in runs among them) run here too.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun --no-env-file install --frozen-lockfile
        working-directory: .
      - run: bun --no-env-file run build:viewer
        working-directory: .
      - run: cargo build --locked --bin grida-fx
        working-directory: .
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run typecheck
      - run: bun --no-env-file test
      # @grida/fx as release.yml packs it (no engine package: those need a release build).
      - name: Pack @grida/fx
        working-directory: .
        run: node tools/build_npm.mjs --out "$RUNNER_TEMP/npm"

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --project python
      - run: uv run --locked --project python python tools/check_spec.py

  # Every conformance case, through the command line of a fresh grida-fx, with the repository's
  # Python SDK and its built @grida/fx hosting the node bodies. --strict: a case without reviewed
  # output fails.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run build:viewer
      - run: bun --no-env-file install --frozen-lockfile
        working-directory: js/fx
      - run: bun --no-env-file run build
        working-directory: js/fx
      - run: cargo build --locked --bin grida-fx
      - run: python3 tools/check_viewer.py --command "$PWD/target/debug/grida-fx"
      - run: uv sync --locked --project python
      - name: Local service and browser command integration
        run: >-
          GRIDA_FX_PYTHON="$PWD/python/.venv/bin/python"
          cargo test --locked -p grida-fx --test open --test service --test service_run
      - name: conformance/run.py --strict
        env:
          GRIDA_FX_PYTHON: python/.venv/bin/python
        run: >-
          uv run --locked --project python python conformance/run.py --strict
          --command target/debug/grida-fx --js-sdk js/fx

  # The examples as a clone runs them (examples/README.md): the engine built into the SDK by
  # tools/build_engine.py, then every example planned, and every runnable one run offline through
  # the SDK. Paid calls are refused at $0; tools/check_examples.py holds the examples to that.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun --no-env-file install --frozen-lockfile
      - run: uv sync --locked --project python
      - run: python3 tools/build_engine.py
      - run: uv run --locked --project python python tools/check_examples.py
      # Showcase processing libraries belong to examples, not to the distributed SDK.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv pip install --python python/.venv/bin/python -r examples/requirements-ci.txt
      - run: python/.venv/bin/python tools/check_showcase_examples.py
      - run: uv run --locked --project python python tools/check_viewer_fixtures.py
      - run: uv run --locked --project python python tools/check_observation.py --command "$PWD/python/src/grida/fx/_bin/grida-fx"
      - run: uv run --locked --project python python tools/check_control.py --command "$PWD/python/src/grida/fx/_bin/grida-fx"

  # `grida fx`, as the npm grida command carries it (spec/distribution.md): @grida/fx and this
  # machine's engine package, packed from a fresh build, installed beside the host fixture, and
  # held to the whole conformance suite and the viewer check through `grida fx`. On macOS: a
  # debug Linux build links glibc past the engine packages' 2.28 baseline, which build_npm refuses.
  host:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
      # grida's runtime (Node 24 or later), not @grida/fx's oldest.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run build:viewer
      - run: bun --no-env-file install --frozen-lockfile
        working-directory: js/fx
      - run: cargo build --locked --bin grida-fx
      - run: uv sync --locked --project python
      - name: tools/check_host.py
        env:
          GRIDA_FX_PYTHON: python/.venv/bin/python
        run: >-
          uv run --locked --project python python tools/check_host.py
          --engine target/debug/grida-fx

  # Every manifest states the Cargo workspace's version (tools/check_versions.py).
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --no-project --python 3.12 tools/check_versions.py --self-check
      - run: uv run --no-project --python 3.12 tools/check_versions.py
