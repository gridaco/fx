# Layer pictures in; layers that repeat seamlessly, and their scroll placement, out.
fx: workflow/v1
id: looping-parallax
title: Looping parallax
description: Make each supplied layer repeat, by mirroring or by repainting its seam, then compose them.

inputs:
  canvas:
    width:  { type: integer, minimum: 64 }
    height: { type: integer, minimum: 64 }
  layers:
    type: list
    max_items: 32
    items:
      id:       { type: string, pattern: "^[a-z0-9_]+$" }
      file:     { type: file, kind: image }
      order:    { type: integer }
      parallax: { type: number, minimum: 0, maximum: 1 }
      offset_y: { type: integer, default: 0 }
      repeat:   { type: string, enum: [mirror, repaint], default: mirror }

steps:
  layer:
    for_each: ${{ inputs.layers }}
    key: ${{ item.id }}
    assert:
      - check: ${{ facts(item.file).width >= 64 }}
        message: "layer ${{ item.id }} is narrower than 64 px"
      - check: ${{ item.repeat == 'mirror' || facts(item.file).width <= 2048 }}
        message: "layer ${{ item.id }} is too wide to repaint (max 2048 px)"
    steps:
      loops_already:                         # free, deterministic: does it already repeat?
        uses: ./nodes/seams.py#loops_already
        with: { image: "${{ item.file }}" }

      repaint:                               # paid, only for repaint layers that don't loop yet
        if: ${{ item.repeat == 'repaint' && steps.loops_already.facts.verdict == 'reject' }}
        uses: ./nodes/seams.py#layer_repaint
        with:
          image: ${{ item.file }}
          opaque: ${{ facts(item.file).opaque }}

      seam_ok:
        uses: ./nodes/seams.py#seam_check
        judges: repaint
        with: { image: "${{ steps.repaint.outputs.image }}" }
        on_reject: { regenerate: { max: 2, then: continue } }

      mirror:                                # free fallback, and the default mode
        if: >-
          ${{ steps.loops_already.facts.verdict == 'reject'
              && (item.repeat == 'mirror' || steps.seam_ok.facts.verdict == 'reject') }}
        uses: fx/image.mirror_repeat@1
        with: { image: "${{ item.file }}", axis: x }

      chosen:
        uses: fx/select@1
        with:
          first_of:
            - ${{ steps.repaint.outputs.image }}     # only if it exists and was accepted
            - ${{ steps.mirror.outputs.image }}
            - ${{ item.file }}                        # it already looped

  compose:
    uses: ./nodes/compose.py#compose
    with:
      layers: ${{ steps.layer.*.chosen.outputs.image }}
      specs:  ${{ inputs.layers }}
      canvas: ${{ inputs.canvas }}

outputs:
  manifest: ${{ steps.compose.outputs.manifest }}
  preview:  ${{ steps.compose.outputs.preview }}
  layers:   ${{ steps.layer.*.chosen.outputs.image }}
