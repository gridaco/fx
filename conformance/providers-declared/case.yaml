# A project that declares providers (providers.md §1): `acme`, with its key's variable and
# header, a base URL its own variable moves, download hosts and a family, and `local`, a keyless
# server on this machine. A declaration is configuration, not identity: the workflow on an acme
# image route plans, and expands to the same graph with and without the declarations (expand.json,
# saved twice). Only a family reaches a fingerprint (identity.md §7): the chat workflow's
# structured.generate route on acme, declared without a contract, is completed with the
# openai-compatible family's adapter (expand-chat.json), and keeps its bare contract's fingerprint
# once acme is no longer declared. doctor lists each declared provider after the built-in keys,
# with its base URL's host and where its key comes from. A declaration that takes a name FX ships,
# a variable a built-in reads, one FX or the programs it starts read for themselves (in any letter
# case), or a plain-http default base URL off this machine is refused while fx.yaml is read
# (exit 2).
steps:
- argv: [plan, case, --routes, routes.yaml]
  save: plan.txt
- argv: [expand, case, --routes, routes.yaml]
  save: expand.json
  json: true
- argv: [expand, chat, --routes, routes.yaml]
  save: expand-chat.json
  json: true
- argv: [doctor]
  mentions:
  - "provider  acme api.acme.test ACME_API_KEY missing"
  - "provider  local 127.0.0.1:8080 needs no key"
- files:
    fx.yaml: |
      fx: project/v1
      routes:
        image.generate: img-a@acme
  argv: [expand, case, --routes, routes.yaml]
  save: expand.json
  json: true
- argv: [expand, chat, --routes, routes.yaml]
  mentions:
  - b84a7f3e9926f76c4c628e5bfb6cf513d87f0e570b13a65c954113c5c171a055
  never_mentions:
  - c349af10e0a600f63fef6013c88dc88926acf949c5bcade06c74bc4563217099
- files:
    fx.yaml: |
      fx: project/v1
      providers:
        fal:
          base_url: { default: "https://fal.example.test" }
  argv: [plan, case, --routes, routes.yaml]
  status: 2
  mentions:
  - "fx.yaml: providers.fal: fal is a provider FX ships"
- files:
    fx.yaml: |
      fx: project/v1
      providers:
        codex:
          base_url: { default: "https://codex.example.test" }
  argv: [plan, case, --routes, routes.yaml]
  status: 2
  mentions:
  - "fx.yaml: providers.codex: codex is a provider FX ships"
- files:
    fx.yaml: |
      fx: project/v1
      providers:
        acme:
          credential: { variable: ACME_API_KEY }
          base_url: { variable: OPENAI_BASE_URL, default: "https://api.acme.test/v1" }
  argv: [plan, case, --routes, routes.yaml]
  status: 2
  mentions:
  - "fx.yaml: providers.acme.base_url.variable: OPENAI_BASE_URL is already read for openai"
- files:
    fx.yaml: |
      fx: project/v1
      providers:
        acme:
          credential: { variable: https_proxy }
          base_url: { default: "https://api.acme.test/v1" }
  argv: [doctor]
  status: 2
  mentions:
  - "fx.yaml: providers.acme.credential.variable: https_proxy is reserved for FX and the programs it starts"
- files:
    fx.yaml: |
      fx: project/v1
      providers:
        acme:
          credential: { variable: GRIDA_FX_NETWORK }
          base_url: { default: "https://api.acme.test/v1" }
  argv: [plan, case, --routes, routes.yaml]
  status: 2
  mentions:
  - "fx.yaml: providers.acme.credential.variable: GRIDA_FX_NETWORK is reserved for FX and the programs it starts"
- files:
    fx.yaml: |
      fx: project/v1
      providers:
        acme:
          base_url: { default: "http://api.acme.test/v1" }
  argv: [plan, case, --routes, routes.yaml]
  status: 2
  mentions:
  - "fx.yaml: providers.acme.base_url.default: acme base_url must use HTTPS unless it targets a loopback host"
- files:
    fx.yaml: |
      fx: project/v1
      providers:
        acme:
          base_url: { default: "https://api.acme.test/v1" }
          family: openai-compatible
    routes.yaml: |
      fx: routes/v1
      routes:
        - capability: structured.generate
          route: text-a@acme
          price: { cap_usd: 0.05 }
          contract:
            token_limit_field: max_completion_tokens
            image_detail: high
            pictures: unchanged
            billing: { cost: usage.cost, unbilled_statuses: [400, 422] }
  argv: [run, chat, --routes, routes.yaml, --live, --max-usd, "1", --no-view]
  status: 1
  mentions:
  - "the network is off"
  never_mentions:
  - "the contract takes no member"
- files:
    routes.yaml: |
      fx: routes/v1
      routes:
        - capability: structured.generate
          route: text-a@acme
          price: { cap_usd: 0.05 }
          contract:
            billing: { cost: total }
  argv: [run, chat, --routes, routes.yaml, --live, --max-usd, "1", --no-view]
  status: 1
  mentions:
  - "billing.cost is usage.cost"
  never_mentions:
  - "the network is off"
- files:
    routes.yaml: |
      fx: routes/v1
      routes:
        - capability: structured.generate
          route: text-a@acme
          price: { cap_usd: 0.05 }
          contract:
            token_limit_field: other_tokens
  argv: [run, chat, --routes, routes.yaml, --live, --max-usd, "1", --no-view]
  status: 1
  mentions:
  - "token_limit_field is one of max_tokens, max_completion_tokens"
  never_mentions:
  - "the network is off"
- files:
    routes.yaml: |
      fx: routes/v1
      routes:
        - capability: structured.generate
          route: text-a@acme
          price: { cap_usd: 0.05 }
          contract:
            billing: { unbilled_statuses: [408] }
  argv: [run, chat, --routes, routes.yaml, --live, --max-usd, "1", --no-view]
  status: 1
  mentions:
  - "billing.unbilled_statuses contains only integers from 400 through 499, excluding 408 and 429"
  never_mentions:
  - "the network is off"
