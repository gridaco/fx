# An `at: plan` step runs while planning, and a `for_each` over its output expands to keyed
# instances; its price.
steps:
- argv:
  - expand
  - case
  - --routes
  - routes.yaml
  - --inputs
  - inputs.yaml
  save: expand.json
  json: true
  status: 0
- argv:
  - price
  - case
  - --routes
  - routes.yaml
  - --inputs
  - inputs.yaml
  save: price.json
  json: true
  status: 0
