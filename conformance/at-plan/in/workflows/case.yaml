fx: workflow/v1
id: case
title: A list computed while planning
inputs:
  script: { type: file, kind: text/plain }
steps:
  split:
    uses: ./nodes/cases.py#lines
    at: plan
    with: { text: "${{ inputs.script }}" }
  draw:
    for_each: ${{ steps.split.outputs.items.lines }}
    key: ${{ item.id }}
    uses: fx/image.generate@1
    with: { prompt: "${{ item.text }}" }
