# A `for_each` over a step's output with `max:` makes a pending second phase, priced at its maximum.
steps:
- argv:
  - expand
  - case
  - --routes
  - routes.yaml
  - --inputs
  - inputs.yaml
  save: expand.json
  json: true
  status: 0
- argv:
  - price
  - case
  - --routes
  - routes.yaml
  - --inputs
  - inputs.yaml
  save: price.json
  json: true
  status: 0
