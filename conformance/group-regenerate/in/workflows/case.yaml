fx: workflow/v1
id: case
title: A group that regenerates
steps:
  build:
    steps:
      draw: { uses: fx/image.generate@1, with: { prompt: a mesh } }
      audit:
        uses: ./nodes/cases.py#verdict
        judges: draw
        with: { subject: "${{ steps.draw.outputs.image }}", accept_take: 1 }
        on_reject: continue
    regenerate: { max: 3, until: "${{ steps.audit.facts.verdict == 'accept' }}" }
  export:
    uses: ./nodes/cases.py#shout
    with: { text: "${{ steps.build.draw.take }}" }
