# A route priced per second by a setting: each take is priced at its own tier, and a take with no
# setting (`unknown`) or a value no tier names (`unlisted`, 720p) at the route's whole range.
steps:
- argv:
  - price
  - case
  - --routes
  - routes.yaml
  - --inputs
  - inputs.yaml
  save: price.json
  json: true
  status: 0
