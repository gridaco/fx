fx: workflow/v1
id: case
title: Coalesce a field
tables:
  rows:
    - { id: a, note: first }
    - { id: b }
steps:
  bare:
    for_each: ${{ tables.rows }}
    key: ${{ item.id }}
    if: ${{ (item.note ?? null) == null }}
    uses: fx/image.generate@1
    with: { prompt: "${{ item.id }}" }
  noted:
    for_each: ${{ tables.rows }}
    key: ${{ item.id }}
    uses: fx/image.generate@1
    with: { prompt: "${{ item.note ?? item.id }}" }
