# A file input's digest in a local step's identity, a pending value that leaves an identity null,
# and workflow outputs.
steps:
- argv:
  - expand
  - case
  - --routes
  - routes.yaml
  - --inputs
  - inputs.yaml
  save: expand.json
  json: true
  status: 0
- argv:
  - identity
  - case
  - --routes
  - routes.yaml
  - --inputs
  - inputs.yaml
  save: identity.json
  json: true
  status: 0
- argv:
  - price
  - case
  - --routes
  - routes.yaml
  - --inputs
  - inputs.yaml
  save: price.json
  json: true
  status: 0
