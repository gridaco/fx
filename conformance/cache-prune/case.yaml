# `cache prune` over a store written by hand: a store with no recorded users is refused until
# its earlier users are forgotten; a preview removes nothing; what the run names (a result, and a
# paid answer only its reservation names) stays, with their files; the rest goes, and the cost of
# the removed call is reported; the project that pruned is then the store's one user.
steps:
- argv: [cache, prune]
  status: 1
  mentions: ["refused: shared_cache", "--forget-user legacy"]
- argv: [cache, prune, --forget-user, legacy, --json]
  save: preview.json
  json: true
- argv: [cache, prune, --forget-user, legacy, --yes, --json]
  save: pruned.json
  json: true
  absent:
  - .fx/cache/results/1f/1f987d58889448da876cfcca2051ca4dc7138bec2d16f07ef8f826d3c54dd90b.json
  - .fx/cache/calls/58/58e629919e8e5aa47a110454f7c03e868c746ebcce740bc7b58c39bb1ee2c1ed.json
  - .fx/cache/files/75/754e087b2007bbb61542d8b21623156da0d0cc10079bdb673cd4094bbd1c4321
- read: .fx/cache/results/22/2279890ca46f73b4464ceb5c4b3b710c31487c5345575cf4db1888203c34f098.json
  save: kept-result.json
  json: true
- read: .fx/cache/calls/71/71d71a638a87f46c32c74db1d536099b251b7507652ee89842584b53d1aefe61.json
  save: kept-call.json
  json: true
- read: .fx/cache/files/96/96ee155761e9ece572567511d75fae5d24bdd13af22ae2865e8a437788bff809
  save: kept-picture.txt
- read: .fx/cache/files/09/090b9f71bb74b54a49fab7076e8fe6c1e9bc6174dc467808a2b4a4485b55580f
  save: kept-answer.txt
- argv: [cache, prune, --yes]
  mentions: ["removed   0 results, 0 calls (paid $0.00), 0 files: 0 B; keeps 1 results, 1 calls, 2 files"]
