[package]
name = "grida-fx-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
grida-fx-core.workspace = true
grida-fx-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
jsonschema.workspace = true
indexmap.workspace = true
# Connected components, strongly connected components and topological order for the cell
# rule (spec/layout.md §8). MIT OR Apache-2.0; pulls fixedbitset (MIT OR Apache-2.0),
# hashbrown 0.15 (MIT OR Apache-2.0) and foldhash 0.1 (Zlib).
petgraph = { version = "0.8.2", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["fs"] }
axum = "0.8"
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }

tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
