[package]
name = "grida-fx-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The scripted FakeAdapter, the ReplayTransport, NoNetwork and FakeClock: for tests. The grida-fx
# binary never enables it.
testing = ["dep:png"]

[dependencies]
grida-fx-core.workspace = true
grida-fx-protocol.workspace = true
serde_json.workspace = true
indexmap.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
base64.workspace = true
getrandom.workspace = true
regex.workspace = true
url.workspace = true
reqwest.workspace = true
sha2.workspace = true
jsonschema.workspace = true
# Picture reduction for structured output (src/openrouter/README.md).
image.workspace = true
png = { workspace = true, optional = true }
# The scratch folder a Codex conversation runs in.
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
# Ending a Codex's process group (src/codex/process.rs).
rustix = { version = "1.1", features = ["process"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# Grida provider credential file protocol v1: native private opens and its shared lock.
libc = "0.2"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "load_extension"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
tokio.workspace = true
png.workspace = true
tempfile.workspace = true
# The crate's own test helpers (feature `testing`) for its integration tests under tests/.
grida-fx-providers = { path = ".", features = ["testing"] }

[lints]
workspace = true
