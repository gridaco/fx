[project]
name = "grida"
version = "0.1.0"
description = "Grida FX for Python: author nodes and workflows, and drive the grida-fx engine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # The standard bodies (grida.fx.std) write pictures byte for byte as FX's predecessor did:
    # every identity downstream depends on this exact Pillow build (docs/wg/overview.md, decision 8),
    # and on the platform: its Linux x86-64 build writes other PNG bytes than its macOS arm64 build.
    "pillow==12.3.0",
]

[project.urls]
Homepage = "https://grida.co/fx"
Repository = "https://github.com/gridaco/fx"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "rfc8785>=0.1.4",
    "jsonschema>=4.23",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grida"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "../tools", "../conformance"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Conformance fixtures import their project's own `nodes` package.
known-local-folder = ["nodes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
