# Deliberately hard. A written brief in; one rigged, reviewed, game-scale character out.
# Agents, Blender, parts × review rounds, a recovery loop, a long provider job, and a budget
# that matters.
fx: workflow/v1
id: rigged-character
title: Rigged character
description: Draw references, build a textured mesh from them, stand it upright, rig it, and admit it only when numbers and pictures both pass.

inputs:
  brief:     { type: file, kind: text/markdown }
  partition: { type: string, enum: [whole, head_body, head_body_hair], default: whole }
  rigging:   { type: string, enum: [provider, agent], default: provider }
  height_m:  { type: number, default: 1.7 }

tables:
  parts:
    whole:          [ { role: body } ]
    head_body:      [ { role: head }, { role: body } ]
    head_body_hair: [ { role: head }, { role: body }, { role: hair } ]

steps:
  references:
    steps:
      draw:
        uses: ./nodes/agents.py#draw_references       # an agent that draws pictures as a tool
        with: { brief: "${{ inputs.brief }}" }
      review:
        uses: fx/vision.review@1
        judges: draw
        with:
          images: [ "${{ steps.draw.outputs.sheet }}", "${{ steps.draw.outputs.front }}", "${{ steps.draw.outputs.back }}" ]
          question: ./prompts/review-references.md
    regenerate: { max: 3, until: "${{ steps.review.facts.verdict == 'accept' }}" }

  body:                                               # the recovery loop: redo the whole build
    steps:
      part:
        for_each: ${{ lookup(tables.parts, inputs.partition) }}   # known at plan time
        key: ${{ item.role }}
        steps:
          mesh:
            uses: fx/mesh.generate@1
            route: P2-20260801@tripo
            with:
              views:                                         # which side each picture shows
                front: ${{ steps.references.draw.outputs.front }}
                back: ${{ steps.references.draw.outputs.back }}
              face_limit: 10000
          measure:
            uses: ./nodes/blender.py#normalize               # scale, pivot, bounds; reports facts
            with: { mesh: "${{ steps.mesh.outputs.model }}", height_m: "${{ inputs.height_m }}" }
          renders:
            uses: ./nodes/blender.py#turntable
            with: { mesh: "${{ steps.measure.outputs.mesh }}" }
          review:
            uses: fx/vision.review@1
            judges: mesh
            with: { images: "${{ steps.renders.outputs.views }}", question: ./prompts/review-part.md }
        regenerate: { max: 3, until: "${{ steps.review.facts.verdict == 'accept' }}" }

      assemble:
        steps:
          orient:
            uses: ./nodes/agents.py#orient_and_ground        # an agent with Blender tools
            with: { parts: "${{ steps.part.*.measure.outputs.mesh }}" }
          renders:
            uses: ./nodes/blender.py#turntable
            with: { mesh: "${{ steps.orient.outputs.mesh }}" }
          review:
            uses: fx/vision.review@1
            judges: orient
            with: { images: "${{ steps.renders.outputs.views }}", question: ./prompts/review-assembly.md }
        regenerate: { max: 3, until: "${{ steps.review.facts.verdict == 'accept' }}" }

      rig_provider:
        if: ${{ inputs.rigging == 'provider' }}
        uses: fx/mesh.rig@1                               # a long job: submitted once, resumable
        route: v1.0-20240301@tripo
        with: { model: "${{ steps.assemble.orient.outputs.mesh }}" }

      rig_agent:
        if: ${{ inputs.rigging == 'agent' }}
        uses: ./nodes/agents.py#rig_with_blender
        with: { mesh: "${{ steps.assemble.orient.outputs.mesh }}" }

      rig:
        uses: fx/select@1
        with: { first_of: [ "${{ steps.rig_provider.outputs.model }}", "${{ steps.rig_agent.outputs.model }}" ] }

      audit:                                                 # numbers: bones, weights, scale, clips play
        uses: ./nodes/blender.py#audit_rig
        judges: rig
        with: { model: "${{ steps.rig.outputs.model }}", height_m: "${{ inputs.height_m }}" }
    regenerate: { max: 3, until: "${{ steps.audit.facts.verdict == 'accept' }}" }   # 1 build + up to 2 rebuilds

  export:
    uses: ./nodes/blender.py#export_game_glb                 # adds test clips, game scale
    with: { model: "${{ steps.body.rig.outputs.model }}" }

  admit:                                                     # pictures: in the export's own finish
    uses: fx/vision.review@1
    judges: export
    with: { images: "${{ steps.export.outputs.renders }}", question: ./prompts/admit-export.md }
    on_reject: fail

outputs:
  character:  ${{ steps.export.outputs.model }}
  references: ${{ steps.references.draw.outputs.sheet }}
  renders:    ${{ steps.export.outputs.renders }}
