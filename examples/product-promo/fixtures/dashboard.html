<!doctype html><meta charset="utf-8"><title>Forma original dashboard fixture</title>
<style>
@font-face{font-family:Manrope;src:url("FONT_URL")}*{box-sizing:border-box}
body{margin:0;background:#eeedf3;color:#24232e;font:22px Manrope,sans-serif}
.app{margin:28px;border:1px solid #d9d6e1;border-radius:18px;background:#faf9fc;height:944px;overflow:hidden}
header{height:88px;background:#fff;border-bottom:1px solid #e9e6ef;display:flex;align-items:center;gap:32px;padding:0 32px}
.logo{font-size:31px;font-weight:800;letter-spacing:-1px}.path{font-size:20px;color:#7b7589}.right{margin-left:auto;font-size:18px;color:#757080}
.avatar{width:34px;height:34px;border-radius:50%;background:#e7e0f9;color:#72539d;text-align:center;line-height:34px;font-size:17px}
main{display:grid;grid-template-columns:406px 1fr;height:855px}.chat{padding:28px 24px;border-right:1px solid #e9e6ef;position:relative;background:#fff}
.section{font-size:16px;letter-spacing:2px;font-weight:750;color:#948aa5}.chat h2{font-size:24px;margin:18px 0 24px}
.bubble{font-size:23px;line-height:1.52;padding:18px 20px;border-radius:14px;margin:15px 0;background:#f0ebf8}
.reply{font-size:21px;line-height:1.6;margin:20px 8px;color:#6e657d}.status{font-size:19px;color:#786b91;margin:12px 8px}
.status b{color:#8c70b1}.input{position:absolute;left:24px;right:24px;bottom:28px;min-height:130px;padding:20px;border:1px solid #ddd4eb;border-radius:14px;box-shadow:0 4px 15px #271a4610;background:#fff;font-size:22px;line-height:1.45}
.send{position:absolute;bottom:12px;right:12px;background:#8b6ab2;border-radius:9px;color:white;padding:3px 11px;font-size:24px}
.placeholder{color:#a29aa9}.canvas{padding:28px 30px;position:relative}.toolbar{display:flex;align-items:center;gap:16px;font-size:18px;color:#8c8498;height:34px;margin-bottom:24px}.chip{padding:7px 12px;border-radius:8px;background:#ebe5f3;color:#70568d;font-size:16px}
.sheet,.dashboard{padding:32px;border-radius:16px;background:white;border:1px solid #e7e2ec;box-shadow:0 10px 35px #2d1d4308;height:706px}
h1{font-size:33px;letter-spacing:-1px;margin:0 0 12px}.subtitle{font-size:18px;color:#958a9d;margin:0 0 30px}
table{border-collapse:collapse;width:100%;font-size:21px}th{text-align:left;color:#7b7189;font-size:17px;background:#f7f5fa;font-weight:600}th,td{padding:17px 16px;border-bottom:1px solid #eeebf3}td:first-child{color:#7b7287}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.metric{padding:22px 20px;background:#f7f5fa;border:1px solid #eeebf3;border-radius:12px}.metric span{display:block;font-size:17px;color:#8c8097}.metric b{display:block;font-size:36px;font-weight:650;letter-spacing:-1px;margin:10px 0}.up{font-size:16px!important;color:#6c8a6e!important}
.charts{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.chart{border:1px solid #eeebf3;border-radius:12px;padding:22px}.chart h3{font-size:20px;margin:0 0 24px}.bars{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;height:181px;border-bottom:1px solid #e9e4ef;padding:0 18px}.bar{justify-self:center;width:42px;background:#aa91c8;border-radius:7px 7px 0 0}.labels{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:#998ca5;font-size:16px;padding:12px 18px 0}.legend{font-size:17px;color:#988da3;margin-top:22px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:#aa91c8;margin-right:9px}
.donut{width:174px;height:174px;border-radius:50%;margin:8px auto 20px;position:relative;background:conic-gradient(#aa91c8 0 42%,#eae4f2 42% 100%)}.donut:after{content:'42%';position:absolute;inset:29px;background:white;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:650}.segment{float:right;background:#f0ebf7;color:#7e639d;padding:9px 13px;font-size:16px;border-radius:9px}
.note{font-size:17px;color:#968b9e;margin:22px 0}.cursor{position:absolute;z-index:10;width:0;height:0;border-left:12px solid #312b3d;border-top:17px solid transparent;border-bottom:6px solid transparent;transform:rotate(-25deg);filter:drop-shadow(1px 1px 1px white)}
</style><div class="app"><header><div class="logo">forma</div><span class="path">Workspace / Weekly overview</span><span class="right">Saved locally</span><div class="avatar">F</div></header><main><section class="chat"><div class="section">DESIGN WITH FORMA</div><h2>What should we make?</h2><div id="messages"></div><div class="input"><span id="entry" class="placeholder">Describe a design...</span><span class="send">↑</span></div></section><section class="canvas"><div class="toolbar">Weekly figures.csv <span class="chip">7 rows</span><span style="margin-left:auto">Preview &nbsp; · &nbsp; 100%</span></div><div id="result"></div></section></main></div><div class="cursor" id="cursor"></div>
<script>
const request='Turn these weekly figures into a dashboard.';
const refine='Focus on returning customers.';
const rows=[['Monday','$10,420','108','38%'],['Tuesday','$11,860','126','41%'],['Wednesday','$12,180','131','43%'],['Thursday','$13,440','142','44%'],['Friday','$14,720','158','45%'],['Saturday','$11,380','119','41%'],['Sunday','$10,200','105','42%']];
const table='<div class="sheet"><h1>Weekly figures</h1><p class="subtitle">A small starting point. Make something useful.</p><table><thead><tr><th>Day</th><th>Revenue</th><th>Orders</th><th>Returning</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table><p class="note">Original demonstration data · No connected customer account</p></div>';
function dashboard(focused,t){let heights=focused?[65,91,104,137,167,118,86]:[93,110,116,139,169,112,89];let progress=Math.min(1,Math.max(0,(t-(focused?36:21))/0.8));return '<div class="dashboard"><span class="segment">'+(focused?'Returning':'All customers')+'</span><h1>'+(focused?'Returning customers':'Weekly overview')+'</h1><p class="subtitle">'+(focused?'A closer look at the people who come back.':'A clear view of how the week is moving.')+'</p><div class="metrics">'+[['Revenue',focused?'$35,364':'$84,200','↑ 12.8% this week'],['Orders',focused?'375':'889','↑ 8.2% this week'],['Average order',focused?'$94.30':'$94.71','↑ 4.1% this week']].map(m=>'<div class="metric"><span>'+m[0]+'</span><b>'+m[1]+'</b><span class="up">'+m[2]+'</span></div>').join('')+'</div><div class="charts"><div class="chart"><h3>Revenue by day</h3><div class="bars">'+heights.map(h=>'<div class="bar" style="height:'+Math.round(h*progress)+'px"></div>').join('')+'</div><div class="labels">'+['M','T','W','T','F','S','S'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="legend"><i></i>'+(focused?'Returning customers':'All customers')+'</div></div><div class="chart"><h3>Returning share</h3><div class="donut"></div><div class="legend">Returning customers this week</div></div></div><p class="note">'+(focused?'The layout stays editable. Keep refining in chat.':'Built from the supplied table. No invented source data.')+'</p></div>'}
window.renderAt=function(t){let messages='',entry='Describe a design...';if(t>=6)messages+='<div class="bubble">'+request+'</div>';if(t>=6&&t<21)messages+='<div class="status"><b>◌</b> '+(t<11?'Reading the supplied table':t<16?'Building the dashboard layout':'Checking labels and spacing')+'</div>';if(t>=21)messages+='<div class="reply">Your dashboard is ready.<br>What would you like to adjust?</div>';if(t>=29)messages+='<div class="bubble">'+refine+'</div>';if(t>=29&&t<36)messages+='<div class="status"><b>◌</b> Updating the selected view</div>';if(t>=36)messages+='<div class="reply">Focused on returning customers.</div>';if(t>=2&&t<6)entry=request.slice(0,Math.round((t-2)/3.7*request.length));if(t>=26&&t<29)entry=refine.slice(0,Math.round((t-26)/2.7*refine.length));document.getElementById('messages').innerHTML=messages;document.getElementById('entry').textContent=entry;document.getElementById('entry').className=entry==='Describe a design...'?'placeholder':'';document.getElementById('result').innerHTML=t<21?table:dashboard(t>=36,t);let cursor=document.getElementById('cursor');cursor.style.left=(t<6?350:t<26?1180:t<29?350:1200)+'px';cursor.style.top=(t<6||t>=26&&t<29?865:350)+'px'};
renderAt(0);
</script>
