fx: workflow/v1
id: terrain-cover
title: 47-tile terrain cover
description: Build 47 standing on shared ground from one terrain tilemap, locally at $0.

notes:
  reuse_the_atlas:
    about: cover
    text: |
      ## Compose with the existing tiles
      Supply the canonical 1440 × 480 atlas with 120px cells. The cover builds
      one connected occupancy map and selects tiles from their neighbors;
      it does not repaint the artwork. The returned atlas is the exact input.

inputs:
  atlas:
    type: file
    kind: image
    description: A canonical 1440x480 terrain atlas with 120px cells

steps:
  cover:
    title: Build 47 on shared terrain ground
    uses: ./cover.py#terrain_cover
    with:
      atlas: ${{ inputs.atlas }}
    view: true

outputs:
  cover: ${{ steps.cover.outputs.cover }}
  cover_manifest: ${{ steps.cover.outputs.layout }}
  atlas: ${{ steps.cover.outputs.atlas }}
