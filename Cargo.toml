[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/gridaco/fx"
publish = false

[workspace.dependencies]
grida-fx-core = { path = "crates/grida-fx-core" }
grida-fx-protocol = { path = "crates/grida-fx-protocol" }
grida-fx-runtime = { path = "crates/grida-fx-runtime" }
grida-fx-providers = { path = "crates/grida-fx-providers" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ryu-js = "1"
indexmap = { version = "2", features = ["serde"] }
yaml-rust2 = "0.13"
jsonschema = { version = "0.58", default-features = false }
regex = "1"
png = "0.18"
gif = "0.14"
image-webp = "0.2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "process", "io-util", "sync", "time", "macros", "signal", "net"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
unicode-general-category = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
# A released engine carries no symbols, and its remaining paths are remapped by the release
# workflow, so no build machine's folders ship in it.
strip = true
